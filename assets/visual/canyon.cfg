DEATHWARD_CANYON 1
# Cosmetic only. Set enabled 0 and restart to restore the original canyon.
enabled 1
# Face-only detail study. Set 0 to restore the previous rock faces.
irregular_facets 1
# A-derived polygon planes and sparse chips. Set 0 to restore the older face pass.
polygon_facets 1
# Metres; protagonist is approximately 1.8m tall. minimum_height is the nominal
# first elevation; local erosion and broad geological planes vary its height. Caps and walls
# are visual only: navigation and shot collision retain the original terrain.
minimum_height 2.4
maximum_height 6.8
height_variation 0.85
# Number of transitions (3 permits four locally truncated elevation levels).
terrace_count 3
terrace_width 1.4
silhouette_irregularity 0.9
# Narrow chamfer depth and restrained cap undulation; floor diagonals stay fixed.
facet_variation 0.35
rock_debris_density 0.85
floor_vegetation 0.35
base_vegetation 0.9
terrace_vegetation 1.2
plateau_vegetation 0.85
# Detailed shelves/dressing outside playable bounds; low distant terrain remains.
decorative_extent 24
candidates_per_room 360
maximum_decorations 2200

# Static room framing: lower near shoulders and higher distant formations.
# Baked from room coordinates, never changed by camera/player movement.
composition_strength 0.85
